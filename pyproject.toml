[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatix-agent"
version = "0.1.0"
description = "Autonomous self-healing multi-agent engine that turns bug reports into verified patches"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chetan J" }]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # 2.x only: the tool API moved from FastMCP to MCPServer, so 1.x will not import.
    "mcp>=2.0.0",
    "docker>=7.1.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Supplies the pytest plugin behind @pytest.mark.anyio for the async MCP handlers.
    "anyio>=4.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.scripts]
volatix = "cli.main:main"

[tool.setuptools]
packages = ["agent", "agent.nodes", "mcp_server", "sandbox", "cli", "evals"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Docker daemon",
]
